name: Python syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile project and Swin migration Python files
        run: |
          python -m py_compile \
            app.py train.py evaluate.py app_swin.py \
            configs/roadguard_swin_faster_rcnn.py \
            configs/roadguard_swin_faster_rcnn_baseline.py \
            scripts/convert_voc_to_coco_swin.py \
            scripts/tune_swin_thresholds.py \
            scripts/benchmark_swin.py
